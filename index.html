<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>LSG</title>
  <link rel="icon" href="LSG_logo2.png">
  <script>
  
    const gasBaseUrl = "https://script.google.com/macros/s/AKfycbxsb0Z_jd1fer1LahQfwlDE6pIhU-U7jrce8Jf-_6sWXdwneouWQycBsO9r6vDYuPYyow/exec";

    // アクセスされたURLのパラメータ（?sort=date など）を取得
    const queryString = window.location.search; 

    // GASのURLとパラメータを合体させる
    const redirectUrl = gasBaseUrl + queryString;

    // 合体させたURLへ転送（リダイレクト）する
    window.location.replace(redirectUrl);
  </script>
</head>
<body>
  <p>最新のアプリケーションへ移動しています...</p>
</body>
</html>
